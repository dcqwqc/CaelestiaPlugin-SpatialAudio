# A deliberately unconnected SOFA graph used by tests/smoke.py. It never
# receives audio and its playback stream is passive, so loading it is silent.
context.properties = { log.level = 2 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
{ name = libpipewire-module-rt flags = [ ifexists nofail ] }
{ name = libpipewire-module-protocol-native }
{ name = libpipewire-module-client-node }
{ name = libpipewire-module-adapter }
{ name = libpipewire-module-filter-chain args = {
node.description = "Caelestia Spatial Audio SOFA smoke"
filter.graph = {
    nodes = [
        { type = sofa name = hrtf label = spatializer config = {
            filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa"
        } control = { Azimuth = 0 Elevation = 0 } }
    ]
    inputs = [ "hrtf:In" ]
    outputs = [ "hrtf:Out L" "hrtf:Out R" ]
}
capture.props = {
    node.name = "caelestia_spatial_audio_sofa_smoke"
    media.class = Audio/Sink
    audio.channels = 1
    audio.position = [ MONO ]
    node.virtual = true
}
playback.props = {
    node.name = "caelestia_spatial_audio_sofa_smoke_output"
    node.passive = true
    node.dont-reconnect = true
    audio.channels = 2
    audio.position = [ FL FR ]
}
} }
]
